<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square System Prototype</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #333;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }
    nav a:hover {
      background: #575757;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 15px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    input {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>Business Management System Prototype</h1>
  <p>Powered by Square</p>
</header>

<nav>
  <a href="#appointments">Appointments</a>
  <a href="#inventory">Inventory</a>
  <a href="#payroll">Payroll</a>
</nav>

<div class="container">

  <!-- Appointments Section -->
  <section id="appointments" class="card">
    <h2>Appointment Management</h2>
    <p>Book and manage client appointments.</p>
    <input type="text" placeholder="Client Name" />
    <input type="date" />
    <input type="time" />
    <button onclick="bookAppointment()">Book Appointment</button>
    <p id="appointmentMsg"></p>
  </section>

  <!-- Inventory Section -->
  <section id="inventory" class="card">
    <h2>Product Inventory</h2>
    <p>Add and track products.</p>
    <input type="text" placeholder="Product Name" id="productName" />
    <input type="number" placeholder="Quantity" id="productQty" />
    <button onclick="addProduct()">Add Product</button>
    <ul id="inventoryList"></ul>
  </section>

  <!-- Payroll Section -->
  <section id="payroll" class="card">
    <h2>Payroll Management</h2>
    <p>Calculate employee wages.</p>
    <input type="text" placeholder="Employee Name" id="empName" />
    <input type="number" placeholder="Hours Worked" id="hours" />
    <input type="number" placeholder="Hourly Rate" id="rate" />
    <button onclick="calculatePay()">Calculate Pay</button>
    <p id="payResult"></p>
  </section>

</div>

<script>
  function bookAppointment() {
    document.getElementById("appointmentMsg").innerText = "Appointment booked successfully!";
  }

  function addProduct() {
    let name = document.getElementById("productName").value;
    let qty = document.getElementById("productQty").value;

    if (name && qty) {
      let li = document.createElement("li");
      li.innerText = name + " - Quantity: " + qty;
      document.getElementById("inventoryList").appendChild(li);
    }
  }

  function calculatePay() {
    let hours = document.getElementById("hours").value;
    let rate = document.getElementById("rate").value;
    let total = hours * rate;

    document.getElementById("payResult").innerText = "Total Pay: $" + total;
  }
</script>

</body>
</html>
